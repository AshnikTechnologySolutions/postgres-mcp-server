name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Syntax check
        run: |
          python -m py_compile \
            cli.py \
            mcp_server/server.py \
            mcp_server/db.py \
            mcp_server/sql.py \
            mcp_server/http_app.py \
            mcp_server/otel.py \
            mcp_server/request_context.py \
            mcp_server/router.py \
            mcp_server/tools/ops.py \
            mcp_server/tools/*.py

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest tests/ --ignore=tests/test_integration.py -v
