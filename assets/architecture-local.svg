<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="900" height="545" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/>
    </marker>
    <marker id="arr-sm" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9CA3AF"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="545" fill="#F9FAFB" rx="8"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">PostgreSQL MCP Server — Local Development Architecture</text>

  <!-- ═══════════════════════════════════
       LEFT COLUMN: main data flow
  ════════════════════════════════════ -->

  <!-- Claude Desktop -->
  <rect x="50" y="50" width="268" height="78" rx="8" fill="#7C3AED" stroke="#5B21B6" stroke-width="1.5"/>
  <text x="184" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Claude Desktop</text>
  <text x="184" y="106" text-anchor="middle" font-size="12" fill="#DDD6FE">Mac / Windows</text>

  <!-- Arrow: Claude → MCP -->
  <line x1="184" y1="128" x2="184" y2="182" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
  <text x="198" y="160" font-size="11" fill="#374151">STDIO (cli.py)</text>

  <!-- MCP Server -->
  <rect x="50" y="187" width="268" height="90" rx="8" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1.5"/>
  <text x="184" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="white">MCP Server</text>
  <text x="184" y="240" text-anchor="middle" font-size="12" fill="#BFDBFE">FastMCP + cli.py</text>
  <text x="184" y="260" text-anchor="middle" font-size="11" fill="#93C5FD">asyncpg connection pool</text>

  <!-- Arrow: MCP → PostgreSQL -->
  <line x1="184" y1="277" x2="184" y2="332" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
  <text x="198" y="309" font-size="11" fill="#374151">asyncpg</text>

  <!-- PostgreSQL -->
  <rect x="50" y="337" width="268" height="90" rx="8" fill="#065F46" stroke="#064E3B" stroke-width="1.5"/>
  <text x="184" y="371" text-anchor="middle" font-size="14" font-weight="bold" fill="white">PostgreSQL</text>
  <text x="184" y="391" text-anchor="middle" font-size="12" fill="#A7F3D0">Local instance</text>
  <text x="184" y="410" text-anchor="middle" font-size="11" fill="#6EE7B7">mcp_read · mcp_write roles</text>

  <!-- Audit log -->
  <rect x="82" y="452" width="204" height="58" rx="6" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="184" y="476" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">mcp_audit.log</text>
  <text x="184" y="496" text-anchor="middle" font-size="11" fill="#6B7280">JSONL audit events</text>
  <!-- Arrow: MCP → audit log -->
  <line x1="184" y1="427" x2="184" y2="450" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-sm)"/>

  <!-- ═══════════════════════════════════
       RIGHT PANEL: optional observability
  ════════════════════════════════════ -->

  <!-- Dashed amber container -->
  <rect x="368" y="42" width="516" height="490" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="626" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400E">Optional Observability Stack</text>

  <!-- OTel Collector -->
  <rect x="390" y="78" width="218" height="62" rx="6" fill="#B45309" stroke="#92400E" stroke-width="1.5"/>
  <text x="499" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="white">OTel Collector</text>
  <text x="499" y="126" text-anchor="middle" font-size="11" fill="#FEF3C7">:4317 gRPC  ·  :4318 HTTP</text>

  <!-- Tempo -->
  <rect x="390" y="188" width="200" height="62" rx="6" fill="#6D28D9" stroke="#5B21B6" stroke-width="1.5"/>
  <text x="490" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Grafana Tempo</text>
  <text x="490" y="235" text-anchor="middle" font-size="11" fill="#EDE9FE">Traces · :3200</text>

  <!-- Prometheus -->
  <rect x="614" y="188" width="200" height="62" rx="6" fill="#B91C1C" stroke="#991B1B" stroke-width="1.5"/>
  <text x="714" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Prometheus</text>
  <text x="714" y="235" text-anchor="middle" font-size="11" fill="#FEE2E2">Metrics · :9090</text>

  <!-- Promtail -->
  <rect x="390" y="295" width="200" height="62" rx="6" fill="#0E7490" stroke="#155E75" stroke-width="1.5"/>
  <text x="490" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Promtail</text>
  <text x="490" y="342" text-anchor="middle" font-size="11" fill="#CFFAFE">Log shipper</text>

  <!-- Loki -->
  <rect x="614" y="295" width="200" height="62" rx="6" fill="#0E7490" stroke="#155E75" stroke-width="1.5"/>
  <text x="714" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Grafana Loki</text>
  <text x="714" y="342" text-anchor="middle" font-size="11" fill="#CFFAFE">Audit Logs · :3100</text>

  <!-- Grafana -->
  <rect x="498" y="403" width="258" height="72" rx="6" fill="#C2410C" stroke="#9A3412" stroke-width="1.5"/>
  <text x="627" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Grafana</text>
  <text x="627" y="451" text-anchor="middle" font-size="12" fill="#FED7AA">Dashboards · :3000</text>
  <text x="627" y="468" text-anchor="middle" font-size="10" fill="#FFEDD5">Traces · Metrics · Logs</text>

  <!-- Internal observability arrows -->
  <!-- OTel → Tempo -->
  <line x1="472" y1="140" x2="460" y2="186" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr-sm)"/>
  <!-- OTel → Prometheus -->
  <line x1="566" y1="140" x2="682" y2="186" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr-sm)"/>
  <!-- Promtail → Loki -->
  <line x1="590" y1="326" x2="612" y2="326" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr-sm)"/>
  <!-- Tempo → Grafana -->
  <line x1="536" y1="250" x2="575" y2="401" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr-sm)"/>
  <!-- Prometheus → Grafana -->
  <line x1="708" y1="250" x2="688" y2="401" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr-sm)"/>
  <!-- Loki → Grafana -->
  <line x1="714" y1="357" x2="700" y2="401" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr-sm)"/>

  <!-- ═══ Cross-connections ═══ -->

  <!-- MCP Server right → OTel Collector left (OTel spans) -->
  <polyline points="318,232 354,232 354,109 388,109"
    fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-amber)"/>
  <text x="358" y="196" font-size="10" fill="#92400E">OTel spans</text>

  <!-- audit log right → Promtail left (log file) -->
  <polyline points="286,481 354,481 354,326 388,326"
    fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-sm)"/>
  <text x="358" y="415" font-size="10" fill="#6B7280">tails log</text>

</svg>
