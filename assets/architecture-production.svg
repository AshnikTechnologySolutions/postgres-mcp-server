<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/>
    </marker>
    <marker id="arr-sm" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9CA3AF"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="980" height="620" fill="#F9FAFB" rx="8"/>

  <!-- Title -->
  <text x="490" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">PostgreSQL MCP Server — Production Architecture</text>

  <!-- ═══════════════════════════════════
       LEFT COLUMN: main data flow
  ════════════════════════════════════ -->

  <!-- ─── AI Client row ─── -->
  <!-- Claude Desktop (STDIO → remote DB) -->
  <rect x="20" y="48" width="200" height="78" rx="8" fill="#7C3AED" stroke="#5B21B6" stroke-width="1.5"/>
  <text x="120" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Claude Desktop</text>
  <text x="120" y="97" text-anchor="middle" font-size="11" fill="#DDD6FE">STDIO + run_claude_remote.sh</text>
  <text x="120" y="113" text-anchor="middle" font-size="10" fill="#C4B5FD">→ remote DB directly</text>

  <!-- Claude Code / AI Client (HTTPS) -->
  <rect x="245" y="48" width="210" height="78" rx="8" fill="#7C3AED" stroke="#5B21B6" stroke-width="1.5"/>
  <text x="350" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Claude Code / AI Client</text>
  <text x="350" y="97" text-anchor="middle" font-size="11" fill="#DDD6FE">HTTPS  ·  x-api-key header</text>
  <text x="350" y="113" text-anchor="middle" font-size="10" fill="#C4B5FD">.mcp.json  or  REST</text>

  <!-- Arrow: Claude Desktop STDIO goes down-left (bypasses NGINX) -->
  <polyline points="120,126 120,167 55,167 55,192"
    fill="none" stroke="#9B59B6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- Arrow: Claude Code → NGINX (main) -->
  <line x1="350" y1="126" x2="350" y2="167" stroke="#6B7280" stroke-width="2"/>
  <polyline points="350,167 240,167 240,190"
    fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Label on HTTP arrow -->
  <text x="364" y="152" font-size="11" fill="#374151">HTTPS :443</text>

  <!-- ─── Application Server boundary ─── -->
  <rect x="18" y="182" width="460" height="222" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="30" y="198" font-size="10" fill="#1D4ED8" font-weight="bold">Application Server</text>

  <!-- NGINX -->
  <rect x="40" y="205" width="410" height="72" rx="8" fill="#374151" stroke="#1F2937" stroke-width="1.5"/>
  <text x="245" y="237" text-anchor="middle" font-size="14" font-weight="bold" fill="white">NGINX</text>
  <text x="245" y="257" text-anchor="middle" font-size="12" fill="#D1D5DB">TLS termination  ·  Rate limiting  ·  :443</text>

  <!-- Arrow: NGINX → MCP Server -->
  <line x1="245" y1="277" x2="245" y2="312" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
  <text x="258" y="298" font-size="11" fill="#374151">HTTP :8000 (loopback)</text>

  <!-- MCP HTTP Server -->
  <rect x="38" y="317" width="414" height="78" rx="8" fill="#1D4ED8" stroke="#1E40AF" stroke-width="1.5"/>
  <text x="245" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="white">MCP HTTP Server</text>
  <text x="245" y="367" text-anchor="middle" font-size="12" fill="#BFDBFE">FastAPI + uvicorn  ·  asyncpg pool  ·  audit logging</text>
  <text x="245" y="386" text-anchor="middle" font-size="11" fill="#93C5FD">request_id  ·  OTel spans  ·  JSONL audit</text>

  <!-- Arrow: MCP → PostgreSQL -->
  <line x1="245" y1="404" x2="245" y2="455" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>
  <text x="258" y="434" font-size="11" fill="#374151">asyncpg  (TLS)</text>

  <!-- ─── Database Server boundary ─── -->
  <rect x="22" y="448" width="454" height="108" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="34" y="464" font-size="10" fill="#065F46" font-weight="bold">Database Server</text>

  <!-- PostgreSQL -->
  <rect x="42" y="472" width="414" height="72" rx="8" fill="#065F46" stroke="#064E3B" stroke-width="1.5"/>
  <text x="249" y="503" text-anchor="middle" font-size="14" font-weight="bold" fill="white">PostgreSQL</text>
  <text x="249" y="523" text-anchor="middle" font-size="12" fill="#A7F3D0">Dedicated server  ·  mcp_read role  ·  mcp_write role</text>

  <!-- STDIO bypass label (from Claude Desktop arrow) -->
  <text x="22" y="248" font-size="9" fill="#7C3AED" font-style="italic">STDIO bypasses NGINX</text>
  <text x="22" y="260" font-size="9" fill="#7C3AED" font-style="italic">(connects via cli.py)</text>

  <!-- ═══════════════════════════════════
       RIGHT PANEL: observability stack
  ════════════════════════════════════ -->

  <!-- Dashed amber container -->
  <rect x="510" y="42" width="455" height="555" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="737" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400E">Observability Server</text>

  <!-- OTel Collector -->
  <rect x="528" y="80" width="218" height="62" rx="6" fill="#B45309" stroke="#92400E" stroke-width="1.5"/>
  <text x="637" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="white">OTel Collector</text>
  <text x="637" y="128" text-anchor="middle" font-size="11" fill="#FEF3C7">:4317 gRPC  ·  :4318 HTTP</text>

  <!-- Tempo -->
  <rect x="528" y="192" width="200" height="62" rx="6" fill="#6D28D9" stroke="#5B21B6" stroke-width="1.5"/>
  <text x="628" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Grafana Tempo</text>
  <text x="628" y="239" text-anchor="middle" font-size="11" fill="#EDE9FE">Traces · :3200</text>

  <!-- Prometheus -->
  <rect x="750" y="192" width="197" height="62" rx="6" fill="#B91C1C" stroke="#991B1B" stroke-width="1.5"/>
  <text x="848" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Prometheus</text>
  <text x="848" y="239" text-anchor="middle" font-size="11" fill="#FEE2E2">Metrics · :9090</text>

  <!-- Promtail -->
  <rect x="528" y="302" width="200" height="62" rx="6" fill="#0E7490" stroke="#155E75" stroke-width="1.5"/>
  <text x="628" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Promtail</text>
  <text x="628" y="349" text-anchor="middle" font-size="11" fill="#CFFAFE">Log shipper</text>

  <!-- Loki -->
  <rect x="750" y="302" width="197" height="62" rx="6" fill="#0E7490" stroke="#155E75" stroke-width="1.5"/>
  <text x="848" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Grafana Loki</text>
  <text x="848" y="349" text-anchor="middle" font-size="11" fill="#CFFAFE">Audit Logs · :3100</text>

  <!-- Grafana -->
  <rect x="628" y="412" width="260" height="80" rx="6" fill="#C2410C" stroke="#9A3412" stroke-width="1.5"/>
  <text x="758" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Grafana</text>
  <text x="758" y="464" text-anchor="middle" font-size="12" fill="#FED7AA">Dashboards · :3000</text>
  <text x="758" y="481" text-anchor="middle" font-size="10" fill="#FFEDD5">Traces · Metrics · Logs</text>

  <!-- Legend box -->
  <rect x="528" y="520" width="418" height="62" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
  <text x="735" y="540" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">pg_stat_statements</text>
  <text x="735" y="556" text-anchor="middle" font-size="10" fill="#6B7280">Enable on PostgreSQL for slow_queries tool  ·  Grant SELECT to mcp_read</text>
  <text x="735" y="571" text-anchor="middle" font-size="10" fill="#6B7280">structured_metadata in Loki enables Loki → Tempo trace correlation</text>

  <!-- Internal observability arrows -->
  <!-- OTel → Tempo -->
  <line x1="608" y1="142" x2="596" y2="190" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr-sm)"/>
  <!-- OTel → Prometheus -->
  <line x1="700" y1="142" x2="818" y2="190" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr-sm)"/>
  <!-- Promtail → Loki -->
  <line x1="728" y1="333" x2="748" y2="333" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr-sm)"/>
  <!-- Tempo → Grafana -->
  <line x1="672" y1="254" x2="710" y2="410" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr-sm)"/>
  <!-- Prometheus → Grafana -->
  <line x1="844" y1="254" x2="820" y2="410" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr-sm)"/>
  <!-- Loki → Grafana -->
  <line x1="848" y1="364" x2="830" y2="410" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr-sm)"/>

  <!-- ═══ Cross-connections: app server → observability ═══ -->

  <!-- MCP Server → OTel Collector (traces + metrics) -->
  <polyline points="452,347 486,347 486,111 526,111"
    fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-amber)"/>
  <text x="490" y="226" font-size="10" fill="#92400E">OTel traces</text>
  <text x="490" y="238" font-size="10" fill="#92400E">+ metrics</text>

  <!-- MCP Server → Promtail (audit log file) -->
  <polyline points="452,375 490,375 490,333 526,333"
    fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-sm)"/>
  <text x="492" y="310" font-size="10" fill="#6B7280">mcp_audit.log</text>

</svg>
