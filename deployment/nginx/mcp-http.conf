upstream postgres_mcp_upstream {
    server 127.0.0.1:8000;
    keepalive 32;
}

map $http_x_request_id $request_id_or_generated {
    default $http_x_request_id;
    "" $request_id;
}

limit_req_zone $binary_remote_addr zone=mcp_rate_limit:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name mcp.example.com;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    client_max_body_size 256k;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;

    access_log /var/log/nginx/postgres-mcp-access.log;
    error_log /var/log/nginx/postgres-mcp-error.log warn;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Request-Id $request_id_or_generated always;

    location / {
        limit_req zone=mcp_rate_limit burst=20 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id_or_generated;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_pass http://postgres_mcp_upstream;
    }

    location = /healthz {
        proxy_pass http://postgres_mcp_upstream/healthz;
    }

    location = /readyz {
        proxy_pass http://postgres_mcp_upstream/readyz;
    }
}
