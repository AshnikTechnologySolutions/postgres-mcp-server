file_format: 1.0.0

receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  batch:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resource:
    attributes:
      - key: service.name
        value: postgres-mcp-server
        action: insert

exporters:
  debug:
    verbosity: normal

  prometheus:
    endpoint: "0.0.0.0:9464"

  otlp_grpc/tempo:
    endpoint: "127.0.0.1:14317"
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [debug, otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [debug, prometheus]
