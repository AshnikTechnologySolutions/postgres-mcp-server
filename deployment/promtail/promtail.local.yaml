server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://host.docker.internal:3100/loki/api/v1/push

scrape_configs:
  - job_name: postgres-mcp-audit
    static_configs:
      - targets:
          - localhost
        labels:
          job: postgres-mcp-audit
          app: postgres-mcp-server
          __path__: /workspace/mcp_audit.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            tool_name: tool_name
            transport: transport
            ok: ok
            request_id: request_id
            trace_id: trace_id
            span_id: span_id
      - labels:
          level:
          tool_name:
          transport:
          ok:
      - structured_metadata:
          trace_id: trace_id
          span_id: span_id
      - timestamp:
          source: timestamp
          format: RFC3339Nano
